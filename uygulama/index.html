<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.workers.dev http://localhost:*; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Analizer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="simge/simge-180.png">
<title>GarminAnalizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--isaret:#ffc9a6;--iyi:#bfeedd;--metin:#fff6ec;--tb:66px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#050308;overflow:hidden;touch-action:manipulation}
html.mob,html.mob body{background:#0c0812}
/* iOS ana ekran: position:fixed kutu kısa yerleşim görünümüne kırpılır; belge ekran kadar uzar, sahne akışta boyanır */
html.iosTam,html.iosTam body{height:var(--ekran-h,100%);min-height:calc(100% + env(safe-area-inset-top));overflow:hidden;overscroll-behavior:none}
html.iosTam body{position:relative}
html.iosTam .tel.mob{position:absolute}
body{font-family:'Onest',system-ui,sans-serif;color:var(--metin);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:#ffc9a6;color:#1a0d14}
:focus-visible{outline:2px solid var(--isaret);outline-offset:2px}
.sahne{height:100dvh;display:grid;place-items:center}
.tel{--st:40px;--sb:0px;--tb:calc(max(var(--sb),10px) - var(--sb) + 84px);width:390px;height:844px;position:relative;overflow:hidden;border-radius:46px;background:#0c0812;flex:none;box-shadow:0 40px 120px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);user-select:none;-webkit-user-select:none}
.tel.mob{--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--tb:calc(max(var(--sb),10px) - var(--sb) + 84px);position:fixed;left:0;top:0;border-radius:0;transform-origin:0 0;box-shadow:none}
.tam{position:absolute;inset:0;width:100%;height:100%}
svg{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* başlık */
.bas{position:absolute;left:24px;right:24px;top:calc(var(--st) + 14px)}
.bas .tarih{font-size:13px;font-weight:500;color:rgba(255,246,236,.78);padding-right:92px}
.bas h1{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100,'opsz' 144;font-weight:430;font-size:42px;line-height:1.03;letter-spacing:-.025em;margin-top:6px;min-height:43px;text-wrap:balance}
.bas .ger{font-size:15px;line-height:1.42;margin-top:8px;color:rgba(255,246,236,.9);text-wrap:pretty}
.kel{display:inline-block;white-space:nowrap}.h{display:inline-block;will-change:transform}

/* BUGÜN */
#bugun .bas{pointer-events:none}
#yor{pointer-events:none}
#yor ellipse{stroke:rgba(255,246,236,.11);stroke-width:1}
#yor .dis{stroke-dasharray:2 9;stroke:rgba(255,201,166,.3)}
#dokun{position:absolute;border-radius:50%;touch-action:none;cursor:grab}
#dokun:active{cursor:grabbing}
.et{position:absolute;left:0;top:0;will-change:transform,opacity;border-radius:22px}
.kart{position:relative;width:104px;height:100px;padding:10px 10px 8px;display:flex;flex-direction:column;text-align:left;border-radius:22px;overflow:hidden;
  background:linear-gradient(158deg,rgba(255,246,236,.17),rgba(255,246,236,.045) 62%);
  border:1px solid rgba(255,246,236,.17);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 12px 30px rgba(4,2,8,.45),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -14px 22px rgba(4,2,8,.18);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.5),border-color .25s,box-shadow .25s}
.kart::before{content:"";position:absolute;left:-30%;top:-60%;width:90%;height:110%;background:radial-gradient(closest-side,rgba(255,255,255,.2),rgba(255,255,255,0));pointer-events:none}
.et:hover .kart{border-color:rgba(255,246,236,.34)}
.et:active .kart{transform:scale(.92)}
.et.sap .kart{border-color:rgba(255,201,166,.5);box-shadow:0 12px 30px rgba(4,2,8,.45),0 0 26px rgba(255,150,100,.2),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -14px 22px rgba(4,2,8,.18)}
.kart .ust{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:500;color:rgba(255,246,236,.88);white-space:nowrap;line-height:14px}
.kart .ust svg{width:9px;height:9px;stroke:rgba(255,246,236,.6);stroke-width:1.8;flex:none}
.kart .orta{display:flex;align-items:baseline;gap:3px;margin-top:1px;line-height:28px}
.kart .deger{font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kart .br{font-size:11.5px;color:rgba(255,246,236,.75)}
.kart .kiv{width:100%;height:20px;margin-top:2px;overflow:visible}
.kart .kiv .bant{fill:rgba(255,246,236,.13);stroke:none}
.kart .kiv .cz{stroke:var(--iyi);stroke-width:1.6;vector-effect:non-scaling-stroke}
.kart .kiv .uc{fill:var(--iyi);stroke:none}
.kart .dr{display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:rgba(255,246,236,.78);margin-top:3px;white-space:nowrap;line-height:13px}
.dr svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.7;flex:none}
.et.sap .deger,.et.sap .dr{color:var(--isaret)}.et.sap .dr{font-weight:600}
.et.sap .kiv .cz{stroke:var(--isaret)}.et.sap .kiv .uc{fill:var(--isaret)}
.gunler{position:absolute;left:12px;right:12px;bottom:calc(var(--tb) + var(--sb));display:flex;justify-content:space-between}
.gun{width:48px;height:58px;color:rgba(255,246,236,.68);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;border-radius:12px}
.gun i{display:block;width:calc(7px + var(--e)*14px);height:calc(7px + var(--e)*14px);border-radius:50%;background:var(--c);box-shadow:0 0 calc(4px + var(--e)*14px) var(--c);outline:1.5px solid transparent;outline-offset:3px;transition:outline-color .3s}
.gun .yuva{height:30px;display:grid;place-items:center}
.gun[aria-pressed=true]{color:var(--metin);font-weight:600}
.gun[aria-pressed=true] i{outline-color:rgba(255,246,236,.85)}

/* TREND */
#trend{visibility:hidden;opacity:0;touch-action:none;cursor:grab}
#trend:active{cursor:grabbing}
#yildiz i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
#gunes{position:absolute;left:0;top:0;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;will-change:transform}
#trend .bas{pointer-events:none;text-shadow:0 1px 16px rgba(10,6,20,.5)}
.secici{display:flex;gap:6px;margin:0 74px 12px -24px;padding:2px 24px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.secici::-webkit-scrollbar{display:none}
.secici button{flex:none;min-height:44px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap;color:rgba(255,246,236,.86);background:rgba(12,8,18,.32);border:1px solid rgba(255,246,236,.2);text-shadow:none;transition:background .2s,color .2s,border-color .2s}
.secici button[aria-pressed=true]{background:var(--metin);color:#1a1022;border-color:var(--metin);font-weight:600}
#trend .tarih{padding-right:0}
#trend #tTarih{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
#trend #tKaynak{padding:3px 8px;border:1px solid rgba(255,246,236,.24);border-radius:999px;background:rgba(12,8,18,.48);font:600 10px/1.2 system-ui,sans-serif;letter-spacing:.02em;color:rgba(255,246,236,.82);white-space:nowrap}
#trend #tKaynak[hidden]{display:none}
#ust{pointer-events:none}
#imlec{stroke:rgba(255,246,236,.5);stroke-width:1;stroke-dasharray:2 5}
#nokta{fill:var(--metin);stroke:rgba(10,6,16,.55);stroke-width:2}
#nokta.sap{fill:var(--isaret)}
#bantUst,#bantAlt{stroke:rgba(255,246,236,.42);stroke-width:1;stroke-dasharray:3 5}
#bantDolgu{fill:rgba(255,246,236,.1)}
#bantYazi{fill:rgba(255,246,236,.82);font:500 11.5px 'Onest',sans-serif;font-variant-numeric:tabular-nums}
.gn{stroke:none}
.cizgi text{fill:rgba(255,246,236,.68);font:500 11px 'Onest',sans-serif;text-anchor:middle;font-variant-numeric:tabular-nums}
.cizgi line{stroke:rgba(255,246,236,.3);stroke-width:1}
#balon{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;text-shadow:0 1px 12px rgba(8,4,14,.9),0 0 3px rgba(8,4,14,.7);will-change:transform}
#balon b{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.025em;line-height:1}
#balon .br{font-size:14px;margin-left:3px;color:rgba(255,246,236,.85)}
#balon .dr{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;margin-top:3px;color:rgba(255,246,236,.9)}
#balon.sap b,#balon.sap .dr{color:var(--isaret)}
#cip{position:absolute;left:50%;bottom:calc(var(--tb) + var(--sb) + 10px);transform:translateX(-50%);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--metin);color:#1a1022;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
#ipucu{position:absolute;left:0;right:0;top:0;text-align:center;font-size:12px;color:rgba(255,246,236,.8);pointer-events:none;text-shadow:0 1px 8px rgba(8,4,14,.8)}

/* Seçili ölçümün simgesi ve açıklaması. Yorum uzun olsa da grafik yerini korur. */
.tBaslik{display:flex;align-items:center;gap:12px}
#trend .tBaslik h1{font-size:36px;min-height:38px}
#tSimge{width:50px;height:50px;flex:none;pointer-events:auto;border-radius:14px;touch-action:manipulation}
#tSimge svg{display:block;width:50px;height:50px}
#tSimge:focus-visible{outline:2px solid var(--metin);outline-offset:4px}
#tMetin{display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:contain;pointer-events:none;touch-action:pan-y;scrollbar-width:thin}
#tMetin.kayar{pointer-events:auto}
#tGer{overflow-y:auto;min-height:0;overscroll-behavior:contain;touch-action:pan-y;flex:1}
#tYz{flex:none}
#trend #tGer{font-size:14px;line-height:1.35}
.genis #tBas{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);column-gap:18px;align-items:start}
.genis #secici{grid-column:1 / -1;margin-bottom:8px}
.genis #tTarih{grid-column:1;grid-row:2}
.genis .tBaslik{grid-column:1;grid-row:3}
.genis #tMetin{grid-column:2;grid-row:2 / span 2}
.genis #trend #tGer{font-size:13px;line-height:1.35;margin-top:0}
.genis #trend .tBaslik h1{font-size:32px;min-height:34px}
.genis #balon b{font-size:34px}
#trend .bas .yz{font-size:11px;line-height:1.3;margin-top:5px;color:rgba(255,246,236,.7)}
#tAciklama{position:absolute;left:24px;right:24px;z-index:4;padding:16px 18px;border:1px solid rgba(255,246,236,.24);border-radius:18px;background:rgba(20,14,30,.97);box-shadow:0 12px 36px rgba(0,0,0,.3);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;cursor:auto}
#tAciklama[hidden]{display:none}
#tAciklama h2{font-size:15px;font-weight:600;line-height:1.3}
#tAciklama p{font-size:13px;line-height:1.5;margin-top:6px}
#tAciklamaYon{color:rgba(255,246,236,.75)}
.genis #tAciklama{padding:10px 14px;box-shadow:none;background:rgba(20,14,30,.65)}
.genis #tAciklama h2{font-size:13px}
.genis #tAciklama p{font-size:12px;line-height:1.4;margin-top:3px}

/* uçan sayı, sekmeler, ses, ayarlar */
.ucan{position:absolute;left:0;top:0;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;pointer-events:none;z-index:7;text-shadow:0 0 18px rgba(255,220,190,.7)}
.sekme{position:absolute;left:12px;right:12px;max-width:540px;margin:0 auto;height:64px;bottom:calc(max(var(--sb),10px) + 10px);padding:0 6px;display:flex;align-items:center;z-index:5;border-radius:32px;
  background:linear-gradient(180deg,rgba(255,246,236,.1),rgba(255,246,236,0) 46%),rgba(26,16,42,.74);
  border:1px solid rgba(255,246,236,.2);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);
  box-shadow:0 12px 32px rgba(5,3,10,.5),0 2px 8px rgba(5,3,10,.35),inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(255,255,255,.04);
  transition:max-width .34s cubic-bezier(.32,.72,0,1),height .34s cubic-bezier(.32,.72,0,1)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sekme{background:rgba(26,16,42,.95)}}
/* Aşağı kaydırılan ekranlarda (Aktiviteler, Takvim) kapsül daralır, etiketler silinir; yukarıda açılır. 4 x 50 px hedef, 44 px sınırının üstünde. */
.sekme.toplandi{max-width:272px;height:56px}
.sekme button{position:relative;flex:1;min-width:0;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:26px;font-size:10.5px;font-weight:500;letter-spacing:.01em;color:rgba(255,246,236,.72);transition:color .2s,opacity .15s}
.sekme button:active{opacity:.6}
.sekme button:focus-visible{outline:2px solid var(--isaret);outline-offset:-2px}
.sekme svg.sm{position:relative;z-index:1;width:24px;height:24px;flex:none;stroke:currentColor;stroke-width:1.6;overflow:visible;transition:filter .3s}
.sekme span{position:relative;z-index:1;max-height:14px;overflow:hidden;white-space:nowrap;transition:opacity .18s,max-height .3s}
.sekme.toplandi span{opacity:0;max-height:0}
.sekme.toplandi button{gap:0}
/* Her sekmenin kendi rengi; --akr aynı rengin kanalları (cam tinti ve ışıma için) */
#sBugun{--ak:#ffc9a6;--akr:255 201 166}
#sTrend{--ak:#b9a2ff;--akr:185 162 255}
#sAktivite{--ak:#ff8f7a;--akr:255 143 122}
#sTakvim{--ak:#9fe8c7;--akr:159 232 199}
.sekme button[aria-current=page]{color:var(--ak);font-weight:700}
/* Seçili sekmenin cam kapsülü (dış çubuk zaten bulanıkladığı için kendi backdrop-filter'ı yok): buzlu açık tint, alttan sekme renginde hafif yansıma, üstte ince ışık çizgisi, 1px parlak iç kenar, iç derinlik ve dışta yumuşak gölge */
.sekme button::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transform:scale(.92);transition:opacity .22s,transform .34s cubic-bezier(.32,.72,0,1);
  background:radial-gradient(130% 90% at 50% 118%,rgb(var(--akr) / .34),rgb(var(--akr) / 0) 70%),linear-gradient(180deg,rgba(255,250,244,.32),rgba(255,250,244,.1) 46%,rgba(255,250,244,.18)),rgb(var(--akr) / .1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.13),inset 0 9px 12px -11px rgba(255,255,255,.55),inset 0 -7px 12px -9px rgb(var(--akr) / .5),0 6px 14px -5px rgba(5,3,10,.6),0 0 22px -8px rgb(var(--akr) / .65)}
/* Işık kıran kenar: sol üstte parlayan, altta sekme rengine dönen 1px halka (maske ile yalnız kenar boyanır) */
.sekme button::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .22s;
  background:linear-gradient(162deg,rgba(255,255,255,.9),rgba(255,255,255,.16) 28%,rgba(255,255,255,0) 50%,rgb(var(--akr) / .4) 80%,rgba(255,255,255,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.sekme button[aria-current=page]::before{opacity:1;transform:none}
.sekme button[aria-current=page]::after{opacity:1}
.sekme button[aria-current=page] svg.sm{filter:drop-shadow(0 0 3.5px rgb(var(--akr) / .55))}
/* Menü simgeleri. Durağan hâl ilk karedir; döngü yalnız .oynar (JS: azaltılmış hareket yok, ekran görünür, telefon) ve seçili sekmede, giriş hareketi .gir sırasında */
.sekme .sm *{transform-box:fill-box;transform-origin:50% 50%}
.sekme .m-nefes,.sekme .m-kuyruk{opacity:0}
.sekme .m-yaprak{transform-origin:50% 100%}
.sekme.oynar .gir .m-halka{animation:mHalkaGir .56s cubic-bezier(.34,1.4,.5,1) both}
.sekme.oynar .gir .m-cekirdek{animation:mCekirdekGir .5s cubic-bezier(.34,1.6,.5,1) both}
.sekme.oynar [aria-current=page]:not(.gir) .m-halka{animation:mDon 30s linear infinite}
.sekme.oynar [aria-current=page]:not(.gir) .m-cekirdek{animation:mNefes 4.2s ease-in-out infinite}
.sekme.oynar [aria-current=page]:not(.gir) .m-nefes{animation:mHale 4.2s ease-out infinite}
.sekme.oynar .gir .m-akis{stroke-dasharray:100;animation:mCiz .58s cubic-bezier(.3,.7,.2,1) both}
.sekme.oynar .gir .m-binici{animation:mPit .42s cubic-bezier(.34,1.7,.5,1) .18s both}
.sekme.oynar [aria-current=page]:not(.gir) .m-akis{animation:mAk 7.2s linear infinite}
.sekme.oynar [aria-current=page]:not(.gir) .m-binici{animation:mBin 7.2s linear infinite}
.sekme.oynar .gir .m-iz{stroke-dasharray:100;animation:mCiz .52s cubic-bezier(.3,.7,.2,1) both}
.sekme.oynar [aria-current=page]:not(.gir) .m-iz{opacity:.5;transition:opacity .4s}
.sekme.oynar [aria-current=page]:not(.gir) .m-kuyruk{opacity:1;stroke-width:1.9;animation:mNabiz 3s cubic-bezier(.45,.05,.3,1) infinite}
.sekme.oynar .gir .m-yaprak{animation:mYaprak .5s cubic-bezier(.34,1.5,.5,1) both}
.sekme.oynar .gir .m-nokta circle{animation:mPit .34s cubic-bezier(.34,1.7,.5,1) both}
.sekme.oynar .gir .m-nokta circle:nth-child(2){animation-delay:.05s}
.sekme.oynar .gir .m-nokta circle:nth-child(3){animation-delay:.1s}
.sekme.oynar .gir .m-nokta circle:nth-child(4){animation-delay:.15s}
.sekme.oynar .gir .m-isik{animation:mPit .4s cubic-bezier(.34,1.9,.5,1) .2s both}
.sekme.oynar [aria-current=page]:not(.gir) .m-isik{animation:mIsik 3.6s ease-in-out infinite}
.sekme.oynar .gir::before{animation:mCam .52s cubic-bezier(.32,.72,0,1) both}
@keyframes mCam{0%{opacity:0;transform:scale(.74,.62)}55%{opacity:1;transform:scale(1.035,1.06)}100%{opacity:1;transform:none}}
@keyframes mHalkaGir{0%{opacity:0;transform:rotate(-140deg) scale(.55)}100%{opacity:1;transform:none}}
@keyframes mCekirdekGir{0%{transform:scale(.3)}100%{transform:none}}
@keyframes mDon{to{transform:rotate(360deg)}}
@keyframes mNefes{0%,100%{transform:none}50%{transform:scale(1.13)}}
@keyframes mHale{0%{opacity:0;transform:none}12%{opacity:.55}70%,100%{opacity:0;transform:scale(2.05)}}
@keyframes mCiz{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}
@keyframes mPit{0%{transform:scale(0)}100%{transform:none}}
@keyframes mAk{to{transform:translateX(-18px)}}
@keyframes mBin{0%{transform:none}6.25%{transform:translateY(-.02px)}12.5%{transform:translateY(.51px)}18.75%{transform:translateY(1.56px)}25%{transform:translateY(2.86px)}31.25%{transform:translateY(3.98px)}37.5%{transform:translateY(4.51px)}43.75%{transform:translateY(4.32px)}50%{transform:translateY(3.55px)}56.25%{transform:translateY(2.56px)}62.5%{transform:translateY(1.72px)}68.75%{transform:translateY(1.22px)}75%{transform:translateY(1.03px)}81.25%{transform:translateY(.92px)}87.5%{transform:translateY(.7px)}93.75%{transform:translateY(.34px)}100%{transform:none}}

@media (prefers-reduced-motion:reduce){.sekme .sm *,.sekme button::before{animation:none!important}}
#sesBtn,#ayarBtn{position:absolute;top:calc(var(--st) + 2px);width:44px;height:44px;display:grid;place-items:center;z-index:5;border-radius:50%;color:rgba(255,246,236,.85)}
#sesBtn{right:54px}#ayarBtn{right:10px}
#sesBtn svg,#ayarBtn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.6}
#ayarBtn svg{width:21px;height:21px;stroke-width:1.5}
#ayarBtn[aria-expanded=true]{color:var(--metin)}
.ayarYazi{display:none}
#sesBtn .dalga{transition:opacity .2s}#sesBtn .cizik{opacity:0;transition:opacity .2s}
#sesBtn[aria-pressed=false] .dalga{opacity:0}#sesBtn[aria-pressed=false] .cizik{opacity:1}
#perde{position:absolute;inset:0;background:rgba(5,3,8,.55);z-index:6;visibility:hidden;opacity:0}
#ayar{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--sb));z-index:7;background:#1a1322;border:1px solid rgba(255,246,236,.12);border-radius:28px;padding:22px 22px 18px;visibility:hidden}
#ayar h2{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:430;font-size:26px;letter-spacing:-.02em;margin-bottom:8px}
.satir{display:flex;justify-content:space-between;align-items:center;min-height:56px;font-size:16px;border-top:1px solid rgba(255,246,236,.1)}
.satir a{color:var(--isaret)}
.anah{width:52px;height:32px;border-radius:999px;background:rgba(255,246,236,.18);position:relative;transition:background .2s}
.anah::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff6ec;transition:transform .22s cubic-bezier(.2,.9,.3,1.3)}
.anah[aria-checked=true]{background:#e9966b}.anah[aria-checked=true]::after{transform:translateX(20px)}
#ayar p{font-size:13px;line-height:1.45;color:rgba(255,246,236,.72);margin-top:8px}
#ayar .kapat{width:100%;min-height:48px;margin-top:12px;border-radius:16px;background:rgba(255,246,236,.1);font-weight:600;font-size:15px}
#ayar{max-height:calc(100% - var(--st) - 24px);overflow-y:auto;overscroll-behavior:contain}

/* bağlantı bölümü */
.bag{border-top:1px solid rgba(255,246,236,.1);padding:14px 0 4px;margin-top:4px}
.bag h3{font-size:15px;font-weight:600}
.bag label{display:block;font-size:13px;color:rgba(255,246,236,.78);margin-top:10px}
.bag input{width:100%;min-height:44px;margin-top:4px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,246,236,.22);background:rgba(255,246,236,.07);color:var(--metin);font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
.bag input::placeholder{color:rgba(255,246,236,.45)}
.bag .dgm{display:flex;gap:8px;margin-top:12px}
.bag .dgm button{flex:1;min-height:48px;border-radius:16px;background:rgba(255,246,236,.1);font-weight:600;font-size:15px}
.bag .dgm .bagla{background:var(--metin);color:#1a1022}
.bag .dgm button:disabled{opacity:.45;cursor:default}
.bag .hata{color:var(--isaret);font-weight:600}
.bag [hidden]{display:none}

/* uyarı şeridi (Bugün başlığının üstünde, akış içinde: başlık aşağı itilir) */
.serit{display:flex;gap:8px;align-items:flex-start;margin:0 92px 10px 0;padding:8px 12px;border-radius:14px;background:rgba(255,201,166,.14);border:1px solid rgba(255,201,166,.5);font-size:12.5px;line-height:1.4;color:var(--metin);text-wrap:pretty}
.serit[hidden]{display:none}
button.serit{width:calc(100% - 92px);min-height:44px;margin-right:0;align-items:center;text-align:left;pointer-events:auto}
button.serit svg{margin-top:0}
button.serit span{flex:1}
button.serit svg.ok{width:10px;height:10px;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.serit svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:var(--isaret);stroke-width:1.8}

/* bekleme durumu: bağlantı varken veri gelene kadar. Altı ışık noktası yörüngede dönerek merkezde küreyi
   oluşturur, cam halka bekleme süresince dolar, yazı harf harf yükselir (uygulama.js bekleAc/bekleDevret). */
#bekle{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#0c0812}
#bekle[hidden]{display:none}
#bekle .bIc{display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center}
#bekle .bSahne{position:relative;width:132px;height:132px}
#bekle .bSahne>*{position:absolute;left:50%;top:50%}
#bekle .bHalka{width:132px;height:132px;margin:-66px 0 0 -66px;overflow:visible;transform:rotate(-90deg)}
#bekle .bHalka circle{fill:none;stroke-width:1.6}
#bekle .bHalka .iz{stroke:rgba(255,246,236,.12)}
#bekle .bHalka .dol{stroke:url(#bHalkaR);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 4px rgba(255,201,166,.45))}
#bekle .bKure{width:92px;height:92px;margin:-46px 0 0 -46px}
#bekle .bKure i{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 38% 34%,#ffe3bd,#d98f7e 40%,#6d3a92 80%);box-shadow:0 0 64px rgba(217,143,126,.3);animation:nefes 2.4s ease-in-out infinite}
#bekle .bYor{width:0;height:0}
#bekle .bYor b{position:absolute;left:0;top:0;transform:rotate(calc(var(--i) * 60deg))}
#bekle .bYor em{display:block;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c),0 0 3px #fff6ec}
#bekle p{font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:430;font-size:22px;letter-spacing:-.01em;color:rgba(255,246,236,.9)}
#bekle p .h{display:inline-block}
.gz{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap} /* görsel gizli, ekran okuyucu okur */
.sahneOynar [data-sahne]{transition:none!important} /* sahne geçişinde GSAP transform'u CSS geçişiyle gecikmez */
@keyframes nefes{50%{transform:scale(1.09);opacity:.82}}
@media (prefers-reduced-motion:reduce){#bekle .bKure i{animation:none}#bekle .bYor{display:none}#bekle .bHalka .dol{stroke-dashoffset:0;opacity:.5}}

/* Trend: seçili günün ek ayrıntı satırı (akış dışı; grafiğin altında, sekme çubuğunun üstünde) */
#ekSatir{position:absolute;left:24px;right:24px;pointer-events:none;color:rgba(255,246,236,.92);text-shadow:0 1px 10px rgba(8,4,14,.85)}
#ekSatir[hidden]{display:none}
#ekSatir .em{font-size:12.5px;font-weight:600;line-height:16px;font-variant-numeric:tabular-nums}
#ekSatir .uykuFarki{font-size:12px;line-height:16px;font-variant-numeric:tabular-nums}
#ekSatir .cb{display:flex;gap:2px;height:8px;margin:5px 0 4px;border-radius:4px;overflow:hidden}
#ekSatir .cb span{min-width:3px;background:var(--c)}
#ekSatir .lg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;font-size:11px;line-height:14px;font-variant-numeric:tabular-nums}
#ekSatir .lg b{display:flex;align-items:center;gap:4px;font-weight:500;color:rgba(255,246,236,.82);white-space:nowrap}
#ekSatir .lg i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
#bugun .bas .yz{font-size:12px;font-weight:500;line-height:1.3;margin-top:6px;color:rgba(255,246,236,.7)}
.bas .yz[hidden]{display:none}
#aYz{height:44px;padding:6px 0;background-clip:content-box}
#aYz::after{top:9px}
#aYz:disabled{opacity:.45;cursor:default}
#ayar #yzDurum{font-weight:600;color:var(--isaret)}
#ayar #yzDurum:empty{display:none}
#aBil{height:44px;padding:6px 0;background-clip:content-box}
#aBil::after{top:9px}
#aBil:disabled{opacity:.45;cursor:default}
#ayar #bilDurum{margin-top:0;font-weight:600;color:var(--isaret)}
#ayar #bilDurum:empty{display:none}
#ayar .deneme{width:100%;min-height:44px;margin-top:8px;border-radius:14px;background:rgba(255,246,236,.1);font-weight:600;font-size:14px}
#ayar .deneme:disabled{opacity:.45;cursor:default}
#ayar #surum{font-size:11px;text-align:center;color:rgba(255,246,236,.45);font-variant-numeric:tabular-nums}
#ayar #surum[hidden]{display:none}
#ayar #olcu{font-size:10px;line-height:1.35;text-align:center;color:rgba(255,246,236,.4);font-variant-numeric:tabular-nums;margin-top:2px}
#ayar #olcu[hidden]{display:none}
#ekSatir .lg span{padding-left:11px;font-weight:600;white-space:nowrap}

/* MASAÜSTÜ (geniş ekran, ≥1000×620): yalnız .genis altında geçerlidir; telefon ve çerçeve düzeni etkilenmez.
   Sahne pencereyi doldurur; Bugün ve Trend iki ayrı ölçekli bölgededir (uygulama.js genisKur/genisOlcek). */
html.genis,html.genis body{background:#08050c}
.tel.genis{position:fixed;left:0;top:0;width:100%;height:100%;overflow:clip;border-radius:0;box-shadow:none;background:#08050c;--st:max(14px,env(safe-area-inset-top));--sb:0px;--tb:20px}
.bolge{position:absolute;left:0;top:0;overflow:hidden;overflow:clip;transform-origin:0 0} /* clip: odak ya da kaydırma bölgeyi/sahneyi kaydıramaz */
.genis .sekme{display:none}
/* iki bölge arasında dikiş yok: şeklin zemini sağa, gökyüzü sola doğru sahnenin koyusuna erir */
.genis #gl{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.genis #gok,.genis #yildiz{-webkit-mask-image:linear-gradient(90deg,transparent,#000 160px);mask-image:linear-gradient(90deg,transparent,#000 160px)}
.genis #katman{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px);mask-image:linear-gradient(90deg,transparent,#000 40px)}
.genis.serbest #gl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
.genis.serbest #gok,.genis.serbest #yildiz{-webkit-mask-image:linear-gradient(90deg,transparent,#000 160px,#000 calc(100% - 160px),transparent);mask-image:linear-gradient(90deg,transparent,#000 160px,#000 calc(100% - 160px),transparent)}
.genis.serbest #katman{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.genis #trend,.genis #trend:active{cursor:default}
.genis .secici{flex-wrap:wrap;overflow:visible;margin:0 0 14px;padding:0;-webkit-mask-image:none;mask-image:none}
.genis .secici button{min-height:var(--dok,40px)}
.genis .secici button:not([aria-pressed=true]):hover{border-color:rgba(255,246,236,.42);color:var(--metin)}
.genis #ekSatir{max-width:560px}
#arac{position:absolute;top:var(--st);right:16px;z-index:5;display:flex;gap:8px;align-items:center}
.genis #sesBtn,.genis #ayarBtn,.genis .aracDugme{position:static;height:40px;border:1px solid rgba(255,246,236,.2);background:rgba(12,8,18,.38);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .2s,color .2s}
.genis #sesBtn{width:40px}
.genis #ayarBtn,.genis .aracDugme{display:flex;align-items:center;gap:7px;width:auto;padding:0 16px 0 12px;border-radius:999px;font-size:14px;font-weight:500;color:rgba(255,246,236,.88)}
.genis .aracDugme{padding:0 16px}
.genis .aracDugme[hidden]{display:none}
.genis .ayarYazi{display:inline}
.genis .aracDugme[aria-pressed=true]{border-color:rgba(255,246,236,.5);color:var(--metin)}
@media(any-pointer:coarse){
  .genis .secici button{min-width:var(--dok-temas,44px);min-height:max(var(--dok,40px),var(--dok-temas,44px))}
  .genis #sesBtn,.genis #ayarBtn,.genis .aracDugme{height:44px}
  .genis #sesBtn{width:44px}
}
.genis #sesBtn:hover,.genis #ayarBtn:hover,.genis .aracDugme:hover,.genis #ayarBtn[aria-expanded=true]{border-color:rgba(255,246,236,.45);color:var(--metin)}
/* Aktiviteler ve Takvim: sayfa değil kapsayıcı kayar. Telefonda tüm sahneyi, geniş ekranda Trend bölgesini kaplar; üstte güvenli alan ve sağ üst düğmeler, altta kapsül menü kadar boşluk bırakılır. */
.ekran{position:absolute;inset:0;z-index:3;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;background:#0c0812;padding:calc(var(--st) + 52px) 16px calc(var(--tb) + var(--sb) + 20px);user-select:text;-webkit-user-select:text}
.ekran::-webkit-scrollbar{display:none}
/* Sahne geçişi: ufuktan süpüren ince ışık çizgisi (yalnız transform/opacity ile canlanır) */
#sahneIsik{position:absolute;left:0;top:0;width:100%;height:2px;margin-top:-1px;z-index:4;pointer-events:none;visibility:hidden;opacity:0;will-change:transform,opacity;background:linear-gradient(90deg,rgba(255,226,196,0),rgba(255,238,220,.85) 22%,#fff 50%,rgba(214,246,236,.85) 78%,rgba(214,246,236,0))}
#sahneIsik::before{content:"";position:absolute;left:4%;right:4%;top:-44px;height:90px;background:radial-gradient(50% 50% at 50% 50%,rgba(255,206,168,.26),rgba(196,150,255,.08) 55%,rgba(196,150,255,0))}
.ekran[hidden]{display:none}
.ekranHata{margin-top:28vh;text-align:center;font-size:15px;line-height:1.45;color:rgba(255,246,236,.7)}
.genis .ekran{background:#08050c;padding-left:24px;padding-right:24px}
.genis #perde{background:rgba(5,3,8,.62)}
.genis #ayar{left:50%;top:50%;right:auto;bottom:auto;width:min(440px,calc(100% - 32px));max-height:calc(100% - 48px);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="sahne">
  <div class="tel" id="tel">
    <canvas id="gl" class="tam" aria-hidden="true"></canvas>

    <section id="trend" class="tam" role="slider" tabindex="0" aria-label="Trend: gün seçmek için sola ve sağa kaydır" aria-valuemin="1" aria-valuemax="28">
      <div id="gok" class="tam"></div>
      <div id="yildiz" class="tam" aria-hidden="true"></div>
      <div id="gunes" aria-hidden="true"></div>
      <svg id="katman" class="tam" aria-hidden="true">
        <g id="gArka"><path id="arkaDolgu"/><path id="arkaSirt"/></g>
        <g id="gOn"><path id="onDolgu"/><path id="onSirt"/><g id="gunNokta"></g><g class="cizgi" id="cizgi"></g></g>
        <rect id="bantDolgu" x="0" width="390"/><line id="bantUst" x1="0" x2="390"/><line id="bantAlt" x1="0" x2="390"/><text id="bantYazi" x="14"></text>
      </svg>
      <svg id="ust" class="tam" aria-hidden="true"><line id="imlec"/><circle id="nokta" r="6"/></svg>
      <div id="balon"><div><b>0</b><span class="br"></span></div><div class="dr"></div></div>
      <header class="bas" id="tBas">
        <nav class="secici" id="secici" aria-label="Ölçüm seç"></nav>

        <div class="tBaslik"><button type="button" id="tSimge" aria-controls="tAciklama" aria-expanded="false" aria-label="Ölçüm nedir?"></button><h1 id="tAd"></h1></div>
        <div id="tMetin"><p class="ger" id="tGer"></p><p class="yz" id="tYz" hidden>Yapay zekâ yorumu</p></div>
      </header>
      <aside id="tAciklama" aria-labelledby="tAciklamaSoru" hidden><h2 id="tAciklamaSoru"></h2><p id="tAciklamaMetin"></p><p id="tAciklamaYon"></p></aside>

      <div id="ekSatir" hidden></div>
      <div id="cip"></div>

    <section id="bugun" class="tam">
      <div id="bugunUst" class="tam">
        <svg id="yor" class="tam" aria-hidden="true"><ellipse id="yIc"/><ellipse class="dis" id="yDis"/></svg>
        <header class="bas" id="bBas"><div class="serit" id="serit" role="status" hidden><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.8l5.6 9.8H1.4zM7 5.6v2.8M7 10v.01"/></svg><div id="seritMetin"></div></div><button type="button" class="serit" id="seritDugme" hidden><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.8l5.6 9.8H1.4zM7 5.6v2.8M7 10v.01"/></svg><span id="seritDugmeMetin"></span><svg class="ok" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5L7 5 3 8.5"/></svg></button><p class="tarih" id="bTarih"></p><h1 id="bHukum"></h1><p class="ger" id="bGer"></p><p class="yz" id="bYz" hidden>Yapay zekâ yorumu</p></header>
        <nav class="gunler" id="gunler" aria-label="Son yedi gün"></nav>
      </div>
      <div id="dokun" aria-hidden="true"></div>
      <div id="etiketler"></div>
    </section>

    <section id="aktivite" class="ekran" aria-label="Aktiviteler" hidden></section>
    <section id="takvim" class="ekran" aria-label="Takvim" hidden></section>
    <div id="sahneIsik" aria-hidden="true"></div>

    <button id="sesBtn" type="button" aria-pressed="true" aria-label="Ses efektleri">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4h3l4 3.5v-11L6 8z"/><path class="dalga" d="M13 7.5a3.5 3.5 0 010 5M15.2 5.3a6.5 6.5 0 010 9.4"/><path class="cizik" d="M13.5 8l4 4M17.5 8l-4 4"/></svg>
    </button>
    <button id="ayarBtn" type="button" aria-label="Ayarlar" aria-haspopup="dialog" aria-controls="ayar" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="ayarYazi">Ayarlar</span>
    </button>
    <nav class="sekme" aria-label="Ekranlar">
      <button type="button" id="sBugun" aria-current="page">
